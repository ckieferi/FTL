name: Deploy to Strato via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: List remote directories
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "set sftp:auto-confirm yes; set net:timeout 30; open sftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER:22; ls -la; bye"

      - name: Upload to Strato via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "set sftp:auto-confirm yes; set net:timeout 60; open sftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER:22; mirror -R --delete --exclude=^\.git/ --exclude=^\.github/ --exclude=^blog/ . /FTLHomepage/; bye"
