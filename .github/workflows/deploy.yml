name: Deploy to Strato via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Upload to Strato via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" \
            -e "set sftp:auto-confirm yes; \
                mirror -R --delete \
                  --exclude=^\.git \
                  --exclude=^\.github \
                  --exclude=^blog/ \
                  . /; \
                bye" \
            sftp://$FTP_SERVER
